name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Check, test and pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - name: Check that the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci
      # Checks, tests and type declarations use the published peer dependency: publish
      # @shieldlabs-ai/js before tagging a release of this package (or re-run this workflow after it).
      - name: Install the published @shieldlabs-ai/js
        run: npm install --no-save "@shieldlabs-ai/js@^1.0.0"
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Pack
        run: npm pack
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: shieldlabs-ai-svelte-*.tgz
          if-no-files-found: error
          overwrite: true

  # Only this job can publish. It installs nothing and runs no scripts of the package: it publishes
  # the tarball that the build job checked. Add required reviewers to the `npm` environment in the
  # repository settings to approve each release.
  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: package
      # Safe to re-run: a version that is already on npm is left as it is.
      - name: Publish unless this version is already on npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ "$(npm view "@shieldlabs-ai/svelte@$version" version 2>/dev/null)" = "$version" ]; then
            echo "@shieldlabs-ai/svelte@$version is already on npm: nothing to publish."
            exit 0
          fi
          npm publish "./shieldlabs-ai-svelte-$version.tgz" --provenance --access public
