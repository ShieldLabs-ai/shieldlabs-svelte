name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# @shieldlabs/js is a peer dependency that is not on npm yet. Every job that installs this package
# checks out ShieldLabs-ai/shieldlabs-js next to it, packs it and installs the packed file without
# saving it (see CONTRIBUTING.md). Remove those steps once @shieldlabs/js 1.x is published.

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: shieldlabs-svelte
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ShieldLabs-ai/shieldlabs-js
          ref: main
          path: shieldlabs-js
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            shieldlabs-svelte/package-lock.json
            shieldlabs-js/package-lock.json
      - name: Pack @shieldlabs/js
        working-directory: shieldlabs-js
        run: npm ci && npm run build && npm pack
      - name: Install
        working-directory: shieldlabs-svelte
        run: |
          npm ci
          npm install --no-save ../shieldlabs-js/shieldlabs-js-*.tgz
      - name: Type check (svelte-check)
        working-directory: shieldlabs-svelte
        run: npm run check
      - name: Lint
        working-directory: shieldlabs-svelte
        run: npm run lint
      - name: Test with coverage
        working-directory: shieldlabs-svelte
        run: npm test
      - name: Build (svelte-package and publint)
        working-directory: shieldlabs-svelte
        run: npm run build

  svelte-floor:
    name: Test with Svelte 5.0.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: shieldlabs-svelte
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ShieldLabs-ai/shieldlabs-js
          ref: main
          path: shieldlabs-js
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            shieldlabs-svelte/package-lock.json
            shieldlabs-js/package-lock.json
      - name: Pack @shieldlabs/js
        working-directory: shieldlabs-js
        run: npm ci && npm run build && npm pack
      - name: Install with the oldest Svelte of the peer dependency range
        working-directory: shieldlabs-svelte
        run: |
          npm ci
          npm install --no-save svelte@5.0.0 ../shieldlabs-js/shieldlabs-js-*.tgz
      - name: Test
        working-directory: shieldlabs-svelte
        run: npm test

  example-sveltekit:
    name: SvelteKit example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: shieldlabs-svelte
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ShieldLabs-ai/shieldlabs-js
          ref: main
          path: shieldlabs-js
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            shieldlabs-svelte/package-lock.json
            shieldlabs-js/package-lock.json
      - name: Pack @shieldlabs/js
        working-directory: shieldlabs-js
        run: npm ci && npm run build && npm pack
      - name: Pack @shieldlabs/svelte
        working-directory: shieldlabs-svelte
        run: |
          npm ci
          npm install --no-save ../shieldlabs-js/shieldlabs-js-*.tgz
          npm run build
          npm pack
      - name: Build and check examples/sveltekit against the packed packages
        working-directory: shieldlabs-svelte/examples/sveltekit
        env:
          PUBLIC_SHIELDLABS_PUBLIC_KEY: 0123456789abcdef0123456789abcdef
        run: |
          npm install --no-save --no-package-lock ../../shieldlabs-svelte-*.tgz ../../../shieldlabs-js/shieldlabs-js-*.tgz
          npm run build
          npm run check
